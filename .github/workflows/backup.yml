name: Daily Backup Email
on:
  schedule:
    - cron: '59 23 * * *'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 📦 Archive JSON files
        run: |
          mkdir -p daily_backups
          cp data/*.json daily_backups/
          tar -czvf data_backup.tar.gz daily_backups/
      - name: 📤 Upload Daily Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-data-backup
          path: data_backup.tar.gz
          retention-days: 90
